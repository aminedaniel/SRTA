[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smct-research"
version = "0.2.0"
description = "Systematic research platform for small- and mid-cap technology equities"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "duckdb>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[project.scripts]
smct = "smct_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smct_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
